# CLA gate — every external contribution needs a signed CLA (see CLA.md at the
# repo root, and CONTRIBUTING.md for why). Signing is one comment on the PR:
#
#   I have read the CLA Document and I hereby sign the CLA
#
# Signatures are recorded on the `cla-signatures` branch of this repo.
#
# Security note: this workflow runs on `pull_request_target`, which carries a
# write-scoped token. It deliberately never checks out or executes code from
# the PR head — there is no actions/checkout step. The action reads PR metadata
# and comments, and writes signature records to the signatures branch only.

name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

jobs:
  cla:
    name: CLA check
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/OutsideTheBoxDev/droptime-logger/blob/main/CLA.md
          branch: cla-signatures
          allowlist: RyanLuttrell,dependabot[bot]
