name: Bug report
description: Something in the Logger isn't working the way it should.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this. The more precisely you describe what happened, the faster we can fix it.

        Quick check first: please search [existing issues](https://github.com/OutsideTheBoxDev/droptime-logger/issues) so we don't duplicate work.
  - type: input
    id: version
    attributes:
      label: Logger version
      description: "Find it in the app menu under About."
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux (experimental AppImage)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 15.2 / Windows 11 23H2"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Walk us through exactly what you did, one step per line.
      placeholder: |
        1. Opened the app
        2. Ran Setup → device scan
        3. Started a roast and hit CHARGE
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or a screen recording
      description: |
        Anything that shows the problem helps — a screen recording of a mid-roast glitch is worth a thousand words.
        The Logger keeps its data on your machine, so nothing here is uploaded anywhere unless you attach it yourself.
    validations:
      required: false
